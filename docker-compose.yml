# The API, the relay, and the consumer are the same image with different commands.
x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql+psycopg://ledger:ledger@db:5432/ledger
    KAFKA_BOOTSTRAP: redpanda:9092
  depends_on:
    db:
      condition: service_healthy
    redpanda:
      condition: service_healthy

services:
  api:
    <<: *app
    ports:
      - "8001:8000"  # 8001 on this machine, so it can run next to the risk platform's API

  relay:
    <<: *app
    command: ["python", "-m", "app.events.relay"]

  consumer:
    <<: *app
    command: ["python", "-m", "app.events.consumer"]

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5433:5432"  # 5433 on this machine, so it can run next to the risk platform's database
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Redpanda speaks the Kafka protocol and is lighter to run on a laptop.
  redpanda:
    image: redpandadata/redpanda:v26.1.18
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
