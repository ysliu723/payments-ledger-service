name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ledger -d ledger_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v7

      # Redpanda needs command-line flags, which service containers cannot take, so start it here.
      - name: Start Redpanda (Kafka-compatible)
        run: |
          docker run -d --name redpanda -p 19092:19092 redpandadata/redpanda:v26.1.18 \
            redpanda start --mode=dev-container --smp=1 \
            --kafka-addr=0.0.0.0:19092 --advertise-kafka-addr=localhost:19092
          for i in $(seq 1 60); do
            docker exec redpanda rpk cluster health | grep -qE 'Healthy:.+true' && exit 0
            sleep 2
          done
          echo "Redpanda did not become healthy" && exit 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ledger:ledger@localhost:5433/ledger_test
          KAFKA_BOOTSTRAP: localhost:19092
          REQUIRE_DATABASE: "1"
          REQUIRE_KAFKA: "1"
        run: pytest
